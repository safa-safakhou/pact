name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["17.11", "18.6"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: pact
          POSTGRES_DB: pact_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pact -d pact_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pact:pact@127.0.0.1:5432/pact_test
      TEST_DATABASE_URL: postgres://pact:pact@127.0.0.1:5432/pact_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:non-game
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:integration
      - run: python3 docs/implementation/backlog.py check
