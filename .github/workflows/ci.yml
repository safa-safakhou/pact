name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: pact
          POSTGRES_DB: pact_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pact -d pact_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pact:pact@127.0.0.1:5432/pact_test
      TEST_DATABASE_URL: postgres://pact:pact@127.0.0.1:5432/pact_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:integration
      - run: python3 docs/implementation/backlog.py check

