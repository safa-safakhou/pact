# Dedicated PACT host: HTTPS terminates locally for pact.tinyagenttools.com.
# Gateway HTTP stays private; the tunnel serves temporary legacy connections.
services:
  # This host's backup archives were offloaded and removed on 14 October.
  # Keep archiving off on recreation; live pg_wal remains PostgreSQL-managed.
  postgres:
    command: ["postgres", "-c", "archive_mode=off", "-c", "archive_timeout=0"]
  gateway:
    ports: !override
      - "127.0.0.1:${PACT_LOOPBACK_PORT:-8088}:8080"
      - "${PACT_PRIVATE_BIND_ADDRESS:-10.77.0.2}:${PACT_LOOPBACK_PORT:-8088}:8080"
  public-edge:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - /srv/pact/config/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/pact/config/browser-transfer:/srv/transfer:ro
      - public-edge-data:/data
      - public-edge-config:/config
    networks: [application]
    depends_on:
      gateway:
        condition: service_started

volumes:
  public-edge-data:
  public-edge-config:
